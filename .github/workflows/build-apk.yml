name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Nexora Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.34"
          python -m pip install virtualenv
          python -m pip install buildozer

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer
          echo "y" | buildozer android debug 2>&1 | head -n 1 || true

      - name: Build Nexora APK
        run: |
          buildozer android debug

      - name: Find APK
        id: apk
        run: |
          APK=$(find bin -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK was created."
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Nexora APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error